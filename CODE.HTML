     /* YAKATO SCRIPT WHITE LIGHT */
.yakato-light {
    color: rgb(0, 0, 0);
    background: linear-gradient(
        90deg,
        #eceaea 0%,
        hwb(0 2% 98%) 50%,
        lch(96.96% 0.35 17.6) 100%
    );

    background-size: 200% auto;
    background-clip: text;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;

    filter: drop-shadow(0 0 5px white);
    animation: yakatoWhiteLight 2s ease-in-out infinite alternate;
}

@keyframes yakatoWhiteLight {
    from {
        background-position: 200% center;
    }

    to {
        background-position: -100% center;
    }
}
    :root { --bg: #f7f7f5; --ink: #111111; --mute: #9a9a9a; --sub: #7b7b7b; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: "Inter", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }
    a { color: inherit; text-decoration: none; }

    .hero {
      position: relative;
      height: 100vh;
      min-height: 660px;
      overflow: hidden;
      background: var(--bg);
    }
    #dots {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      z-index: 1;
    }

    nav {
      position: relative;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(18px, 2.6vw, 40px);
      padding-top: 36px;
      font-size: 13.5px;
      line-height: 1;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-right: 10px;
      color: var(--ink);
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -.01em;
    }
    .brand svg { width: 16px; height: 18px; flex: 0 0 auto; }
    .nav-link {
      color: #3a3a3a;
      transition: color .2s ease;
    }
    .nav-link:hover { color: #000; }
    .sign-in {
      margin-left: 10px;
      padding: 10px 21px;
      border-radius: 999px;
      background: #111;
      color: #fff;
      font-weight: 500;
      transition: transform .25s ease;
    }
    .sign-in:hover { transform: translateY(-1px); }

    .copy {
      position: absolute;
      z-index: 3;
      top: 24.5%;
      left: 50%;
      width: min(92vw, 720px);
      transform: translateX(-50%);
      text-align: center;
    }
    h1 {
      font-size: clamp(38px, 3.75vw, 68px);
      font-weight: 500;
      letter-spacing: -.035em;
      line-height: 1.04;
    }
    h1 span { display: block; }
    h1 .muted { color: var(--mute); }
    h1 .ink { color: var(--ink); }
    .copy p {
      max-width: 340px;
      margin: 20px auto 0;
      color: var(--sub);
      font-size: clamp(13px, 1.02vw, 15.5px);
      line-height: 1.4;
    }
    .cta {
      position: relative;
      display: inline-block;
      margin-top: clamp(34px, 3.6vw, 52px);
      isolation: isolate;
    }
    .cta::before {
      position: absolute;
      z-index: 0;
      right: 10%;
      bottom: -6px;
      left: 10%;
      height: 16px;
      border-radius: 50%;
      background: linear-gradient(90deg, #ffcf5a, #7dffa8, #5ad7ff, #9b7bff, #ff6fd8, #ffb36b);
      filter: blur(9px);
      content: "";
      opacity: .85;
      transition: opacity .3s ease, filter .3s ease, bottom .3s ease;
      pointer-events: none;
    }
    .cta a {
      position: relative;
      z-index: 1;
      display: inline-block;
      padding: 11px 20px;
      border-radius: 999px;
      background: #111;
      color: #fff;
      font-size: 13.5px;
      font-weight: 500;
      transition: transform .3s ease;
    }
    .cta:hover::before { bottom: -9px; filter: blur(12px); opacity: 1; }
    .cta:hover a { transform: translateY(-1px); }

    .logos {
      position: absolute;
      z-index: 3;
      right: 0;
      bottom: clamp(28px, 6vh, 64px);
      left: 0;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: clamp(26px, 4.6vw, 66px);
      padding: 0 16px;
      color: #8d8d8d;
      font-size: clamp(14px, 1.18vw, 17px);
      font-weight: 500;
      letter-spacing: -.01em;
    }
    .logo {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      white-space: nowrap;
    }
    .logo svg { width: 17px; height: 17px; fill: currentColor; flex: 0 0 auto; }

    @media (max-width: 760px) {
      nav {
        justify-content: space-between;
        gap: 0;
        padding: 22px 18px 0;
      }
      .nav-link { display: none; }
      .brand, .sign-in { margin: 0; }
      .copy { top: 20%; }
      .logos { gap: 14px 24px; font-size: 13px; }
    }
  </style>
</head>
<body>

    <div class="copy">
      <h1><span class="yakato-light">YAKATO</span><span class="link"></span></h1>
      <p>បើ script នៅក្នុង website មួយណាមានបញ្ហាសុំឆាតមកប្រាប់ខ្ងុំភ្លាមមក </p>

  <script>
    (() => {
      const HAND_SHEET = "https://images.higgs.ai/?default=1&output=webp&url=https%3A%2F%2Fd8j0ntlcm91z4.cloudfront.net%2Fuser_38xzZboKViGWJOttwIXH07lWA1P%2Fhf_20261030_025250_100df7b8-31fd-4614-aa4a-c1b7d5b6b273.png&w=1600&q=85";
      const SRC = {
        LA: [0, .06, .47, .40],
        RA: [.53, .06, .47, .40],
        LB: [0, .55, .47, .40],
        RB: [.53, .55, .47, .40]
      };
      const LOOP = 20;
      const LEVELS = [.26, .52, .78, 1];
      const canvas = document.getElementById("dots");
      const ctx = canvas.getContext("2d");
      const fA = document.createElement("canvas");
      const fB = document.createElement("canvas");
      const aCtx = fA.getContext("2d", { willReadFrequently: true });
      const bCtx = fB.getContext("2d", { willReadFrequently: true });
      const tiles = {};
      const source = new Image();

      let W = 1;
      let H = 1;
      let DPR = 1;
      let step = 5;
      let rowStep = 10.25;
      let cols = 1;
      let rows = 1;
      let R = 2.3;
      let sheetReady = false;

      const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
      const fract = value => value - Math.floor(value);
      const hash = (a, b) => fract(Math.sin(a * 127.1 + b * 311.7) * 43758.5453);
      const smooth = (a, b, x) => {
        const q = clamp((x - a) / (b - a), 0, 1);
        return q * q * (3 - 2 * q);
      };
      const mixAt = (time, on, off, duration) =>
        smooth(on, on + duration, time) * (1 - smooth(off, off + duration, time));

      function buildTile(rect) {
        const [rx, ry, rw, rh] = rect;
        const sw = source.naturalWidth * rw;
        const sh = source.naturalHeight * rh;
        const tile = document.createElement("canvas");
        tile.width = 420;
        tile.height = Math.max(1, Math.round(tile.width * sh / sw));
        const tileCtx = tile.getContext("2d");
        tileCtx.imageSmoothingEnabled = true;
        tileCtx.imageSmoothingQuality = "high";
        tileCtx.drawImage(
          source,
          source.naturalWidth * rx,
          source.naturalHeight * ry,
          sw,
          sh,
          0,
          0,
          tile.width,
          tile.height
        );
        return tile;
      }

      function resize() {
        W = Math.max(1, window.innerWidth);
        H = Math.max(1, window.innerHeight);
        DPR = Math.min(2, window.devicePixelRatio || 1);
        canvas.width = Math.round(W * DPR);
        canvas.height = Math.round(H * DPR);
        canvas.style.width = W + "px";
        canvas.style.height = H + "px";
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
        ctx.imageSmoothingEnabled = true;

        step = Math.max(5, W / 205);
        rowStep = step * 2.05;
        cols = Math.ceil(W / step);
        rows = Math.ceil(H / rowStep);
        R = step * .46;
        fA.width = fB.width = cols;
        fA.height = fB.height = rows;
        aCtx.imageSmoothingEnabled = bCtx.imageSmoothingEnabled = true;
        aCtx.imageSmoothingQuality = bCtx.imageSmoothingQuality = "high";
      }

      function handGeometry(time, left) {
        const portrait = H > W;
        const a = (Math.PI * 2 * time) / LOOP;
        const phase = left ? 0 : Math.PI;
        const hw = W * (portrait ? .66 : .53);
        const hh = hw * ((.40 * 1520) / (.47 * 2688));
        const cy = H * (portrait ? .66 : .54);
        const reach = (.035 * Math.sin(a + phase) + .012 * Math.sin(2 * a + 1.3 + phase)) * W;
        const scale = 1 + .07 * Math.sin(a + .9 + phase);
        const rotation = (left ? 1 : -1) * .045 * Math.sin(a + 2.1 + phase);
        const x = left ? reach - W * .045 : W - hw + W * .045 - reach;
        return { x, cy, hw, hh, scale, rotation, pivotX: left ? 0 : W };
      }

      function drawHand(fieldCtx, tile, time, left) {
        const hand = handGeometry(time, left);
        fieldCtx.save();
        fieldCtx.scale(cols / W, rows / H);
        fieldCtx.translate(hand.pivotX, hand.cy);
        fieldCtx.rotate(hand.rotation);
        fieldCtx.scale(hand.scale, hand.scale);
        fieldCtx.translate(-hand.pivotX, -hand.cy);
        fieldCtx.drawImage(tile, hand.x, hand.cy - hand.hh / 2, hand.hw, hand.hh);
        fieldCtx.restore();
      }

      function drawFields(time) {
        aCtx.save();
        aCtx.setTransform(1, 0, 0, 1, 0, 0);
        aCtx.fillStyle = "#fff";
        aCtx.fillRect(0, 0, cols, rows);
        aCtx.restore();
        bCtx.save();
        bCtx.setTransform(1, 0, 0, 1, 0, 0);
        bCtx.fillStyle = "#fff";
        bCtx.fillRect(0, 0, cols, rows);
        bCtx.restore();

        drawHand(aCtx, tiles.LA, time, true);
        drawHand(aCtx, tiles.RA, time, false);
        drawHand(bCtx, tiles.LB, time, true);
        drawHand(bCtx, tiles.RB, time, false);
      }

      function quantize(value) {
        for (let index = LEVELS.length - 1; index >= 0; index -= 1) {
          if (value >= LEVELS[index] - .13) return LEVELS[index];
        }
        return 0;
      }

      function render(seconds) {
        const time = ((seconds % LOOP) + LOOP) % LOOP;
        ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
        ctx.clearRect(0, 0, W, H);
        if (!sheetReady) return;

        drawFields(time);
        const poseA = aCtx.getImageData(0, 0, cols, rows).data;
        const poseB = bCtx.getImageData(0, 0, cols, rows).data;
        const mL = mixAt(time, 6.2, 14.6, 1.6);
        const mR = mixAt(time, 2.4, 10.4, 1.6);
        const tick = Math.floor(time * 7);
        const portrait = H > W;
        const quietWidth = portrait ? .44 : .2;
        const quietCentre = portrait ? .33 : .385;

        ctx.fillStyle = "#0d0d0d";
        for (let j = 0; j < rows; j += 1) {
          const shift = hash(j, tick) > .965
            ? Math.round((hash(tick, j) - .5) * 8)
            : 0;
          for (let i = 0; i < cols; i += 1) {
            const sampleI = clamp(i - shift, 0, cols - 1);
            const seed = .55 * hash(i, j) + .45 * hash(j * 3.1, 7.7);
            const mix = i < cols / 2 ? mL : mR;
            const selected = seed < mix ? poseB : poseA;
            const lum = selected[(j * cols + sampleI) * 4] / 255;
            let value = clamp((1 - lum - .16) / .42, 0, 1);

            if (mix > .001 && mix < .999 && Math.abs(seed - mix) < .12) {
              value *= Math.abs(seed - mix) / .12;
              if (hash(i + tick, j) <= .4) value *= .3;
            }

            value *= .86 + .14 * Math.sin(time * 3.2 + seed * 40);
            const centreDistance = Math.abs((i + .5) / cols - .5);
            value *= smooth(.035, .11, centreDistance);
            const ex = centreDistance / quietWidth;
            const ey = (((j + .5) * rowStep / H) - quietCentre) / .085;
            value *= smooth(.85, 1.25, Math.hypot(ex, ey));

            const level = quantize(value);
            if (!level) continue;
            const radius = level === LEVELS[0] ? R * .38 : R * level;
            ctx.beginPath();
            ctx.arc((i + .5) * step, (j + .5) * rowStep, radius, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      }

      source.crossOrigin = "anonymous";
      source.decoding = "async";
      source.addEventListener("load", () => {
        Object.entries(SRC).forEach(([name, rect]) => { tiles[name] = buildTile(rect); });
        sheetReady = true;
      });
      source.addEventListener("error", () => {
        console.error("Kindred hand source sheet could not be loaded.");
      });
      source.src = HAND_SHEET;

      resize();
      window.addEventListener("resize", resize, { passive: true });
      const startedAt = performance.now();
      function animate(now) {
        render((now - startedAt) / 1000);
        requestAnimationFrame(animate);
      }
      window.__render = render;
      requestAnimationFrame(animate);
    })();
  </script>
</body>
